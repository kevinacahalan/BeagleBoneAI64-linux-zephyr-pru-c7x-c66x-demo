# The ELF is build/zephyr-main_r5f1_0/zephyr/ai64_r5f1_0.elf. That is not the
# kernel's default name (j7-main-r5f1_0-fw), so the core stays off at boot
# until ai64-demo starts it.
CONFIG_KERNEL_BIN_NAME="ai64_r5f1_0"

# This core's job: a square wave on P8.18 from GPIO2 (src/ai64_blink.c).
# The device manager powers GPIO2, over TI-SCI; the power domain turns it on
# at boot, before the GPIO driver starts.
CONFIG_AI64_JOB_BLINK=y
CONFIG_GPIO=y
CONFIG_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN_TISCI_INIT_PRIORITY=20

# This core has no console UART. Its log goes to a RAM buffer that the
# resource table lists as a trace, so Linux reads it at
# /sys/kernel/debug/remoteproc/remoteprocN/trace0.
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y
