# The ELF is build/zephyr-main_r5f0_0/zephyr/ai64_r5f0_0.elf. That is not the
# kernel's default name (j7-main-r5f0_0-fw), so the core stays off at boot
# until ai64-demo starts it.
CONFIG_KERNEL_BIN_NAME="ai64_r5f0_0"

# EHRPWM4 on P9.25 (src/ai64_pwm.c). The device manager gives it its clock
# and power, over TI-SCI; the power domain turns it on at boot.
CONFIG_PWM=y
CONFIG_CLOCK_CONTROL=y
CONFIG_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN_TISCI_INIT_PRIORITY=20
