# The ELF is build/zephyr-main_r5f1_1/zephyr/ai64_r5f1_1.elf. That is not the
# kernel's default name (j7-main-r5f1_1-fw), so the core stays off at boot
# until ai64-demo starts it.
CONFIG_KERNEL_BIN_NAME="ai64_r5f1_1"

# This core's job: ping the other three cores and collect their status
# (src/ai64_monitor.c).
CONFIG_AI64_JOB_MONITOR=y

# This core has no console UART. Its log goes to a RAM buffer that the
# resource table lists as a trace, so Linux reads it at
# /sys/kernel/debug/remoteproc/remoteprocN/trace0.
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y
