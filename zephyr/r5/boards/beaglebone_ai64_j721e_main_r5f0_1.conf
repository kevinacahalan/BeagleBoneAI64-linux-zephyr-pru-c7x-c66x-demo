# The ELF is build/zephyr-main_r5f0_1/zephyr/ai64_r5f0_1.elf. That is not the
# kernel's default name (j7-main-r5f0_1-fw), so the core stays off at boot
# until ai64-demo starts it.
CONFIG_KERNEL_BIN_NAME="ai64_r5f0_1"

# This core's job: EHRPWM4 on P9.25 (src/ai64_pwm.c). The device manager
# gives it its clock and power, over TI-SCI; the power domain turns it on at
# boot.
CONFIG_AI64_JOB_PWM=y
CONFIG_PWM=y
CONFIG_CLOCK_CONTROL=y
CONFIG_POWER_DOMAIN=y
CONFIG_POWER_DOMAIN_TISCI_INIT_PRIORITY=20

# This core has no console UART. Its log goes to a RAM buffer that the
# resource table lists as a trace, so Linux reads it at
# /sys/kernel/debug/remoteproc/remoteprocN/trace0.
CONFIG_CONSOLE=y
CONFIG_RAM_CONSOLE=y
CONFIG_LOG_MODE_MINIMAL=y
