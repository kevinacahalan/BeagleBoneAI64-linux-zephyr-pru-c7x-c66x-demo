CONFIG_IPM=y
CONFIG_MBOX=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CACHE_MANAGEMENT=y
# TI-SCI over the polled secure proxy (src/ai64_sproxy.c), which starts at
# PRE_KERNEL_1 priority 5. Power domains, on R5F0_1 and R5F1_0, come after it.
CONFIG_TISCI_INIT_PRIORITY=10
# The links to the other R5F cores (src/ai64_ipc.c): ipc_service on the
# icmsg backend. A message is up to 180 bytes, more than pbuf's default
# read buffer.
CONFIG_IPC_SERVICE=y
CONFIG_PBUF_RX_READ_BUF_SIZE=256
