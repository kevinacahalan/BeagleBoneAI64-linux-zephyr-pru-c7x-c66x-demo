BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-ai64"
BBFILE_PATTERN_meta-ai64 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-ai64 = "10"

LAYERDEPENDS_meta-ai64 = "core"
LAYERSERIES_COMPAT_meta-ai64 = "wrynose"
LAYERVERSION_meta-ai64 = "1"
