menu title BeagleBone AI-64 microSD (extlinux.conf) (swap enabled)

timeout 50

default microSD (default)

label microSD (failsafe)
    kernel /Image
    append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p2 ro rootfstype=ext4 fsck.repair=yes resume=/dev/mmcblk1p3 rootwait net.ifnames=0
    fdtdir /

label microSD (debug)
    kernel /Image
    append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p2 ro rootfstype=ext4 fsck.repair=yes resume=/dev/mmcblk1p3 rootwait net.ifnames=0
    fdtdir /

label microSD (default)
    kernel /Image
    append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p2 ro rootfstype=ext4 fsck.repair=yes resume=/dev/mmcblk1p3 rootwait net.ifnames=0
    fdtdir /
    fdtoverlays /overlays/k3-j721e-beagleboneai64-ai64-demo.dtbo
