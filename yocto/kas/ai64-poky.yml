# Minimum Poky image for BeagleBone AI-64.
#
# Layers, kernel, and machine come from TI's poky-wrynose kas file
# (oe-layersetup kas/poky-wrynose-config.yml). That file pulls oe-core,
# meta-poky, meta-arm, meta-ti (meta-ti-bsp and meta-beagle), and the
# meta-oe pieces those layers need. The distro stays poky. This is not
# an Arago tisdk image.
#
# TI's file lives on git.ti.com, which does not always answer, so
# meta-ai64 carries a copy: meta-ai64/kas/ti-poky-wrynose-config.yml.
# That copy says which oe-layersetup commit it is from. Everything in
# this file is ours and overrides it.
#
# Run from the repo root with kas-container. See the top-level README.

header:
  version: 17
  includes:
    - repo: meta-ai64
      file: kas/ti-poky-wrynose-config.yml

build_system: openembedded
machine: beaglebone-ai64
distro: poky
target: ai64-demo-image

repos:
  # Keep TI checkouts under yocto/sources instead of the repo root.
  bitbake:
    path: yocto/sources/bitbake
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    # Host git 2.55 rejects `git branch --contains` when HEAD is
    # refs/heads/.invalid, which is how the Yocto git mirrors are packed.
    patches:
      git-contains:
        repo: meta-ai64
        path: patches/0001-git-fetcher-avoid-branch-contains.patch
  meta-yocto:
    path: yocto/sources/meta-yocto
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804
  meta-openembedded:
    path: yocto/sources/meta-openembedded
    commit: 47d7dbdd10890bbd429bc0cccbe14435c37e5af1
  meta-ti:
    path: yocto/sources/meta-ti
    commit: f14ecb71de5c05d717fe0cecd47fea69f26d5306
  meta-arm:
    path: yocto/sources/meta-arm
    commit: 673e8d7c5dcd14de58092eb73e6ecc5eee5c1735
  oe-core:
    path: yocto/sources/oe-core
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc

  meta-ai64:
    path: yocto/layers/meta-ai64

local_conf_header:
  ai64-poky: |
    DISTRO = "poky"
    MACHINE = "beaglebone-ai64"
    # meta-beagle defaults this machine to the BeagleBoard.org 6.12 kernel
    # (bb_org-6_12). Use TI's own 6.18 staging kernel and U-Boot 2026.01
    # instead. It has the PRU virtio kick and the shutdown handshake, so the
    # image needs neither of the patched modules the 6.18 Debian image does.
    TI_PREFERRED_BSP = "ti-6_18"
    # git.ti.com does not always answer. TI mirrors both trees on GitHub,
    # and the pinned SRCREVs are there too.
    KERNEL_GIT_URI = "git://github.com/TexasInstruments/ti-linux-kernel.git"
    UBOOT_GIT_URI = "git://github.com/TexasInstruments/ti-u-boot.git"
    # Beagle images boot with systemd. This selects usrmerge as well.
    INIT_MANAGER = "systemd"
    # The TI template commits buildhistory. Skip that so the build does
    # not need a git identity.
    BUILDHISTORY_COMMIT = "0"
